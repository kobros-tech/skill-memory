name: SplitMNIST replay modes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "skill_memory/**"
      - ".github/workflows/demo-splitmnist.yml"

jobs:
  splitmnist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: new_class
            refresh: ""
          - mode: small_replay
            refresh: ""
          - mode: replay
            refresh: ""
          - mode: small_replay
            refresh: "--refresh-existing-skills"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Restore or download SplitMNIST dataset
        uses: actions/cache@v4
        with:
          path: data
          key: splitmnist-dataset-v1-${{ runner.os }}

      - name: Run 5 experiences (${{ matrix.mode }} ${{ matrix.refresh }})
        run: |
          python -m skill_memory.demos.demo_splitmnist \
            --dataset-root data \
            --n-experiences 5 \
            --cl-update-mode ${{ matrix.mode }} \
            ${{ matrix.refresh }} \
            --diagnose \
            | tee splitmnist_${{ matrix.mode }}${{ matrix.refresh && '_refresh' || '' }}.txt
          # The replay audit must report no violations.
          grep -q "violations: none" splitmnist_*.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-${{ matrix.mode }}${{ matrix.refresh && '-refresh' || '' }}-${{ github.run_id }}
          path: splitmnist_*.txt
          if-no-files-found: warn
          retention-days: 14

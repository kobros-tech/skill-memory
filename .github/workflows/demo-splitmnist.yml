name: SplitMNIST update modes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "skill_memory/**"
      - ".github/workflows/demo-splitmnist.yml"

jobs:
  splitmnist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: new_class, mode: new_class, replay: ""}
          - {label: replay_capped, mode: replay, replay: "--replay-samples-per-class 5"}
          - {label: replay_full, mode: replay, replay: ""}
          - {label: refresh_capped, mode: refresh, replay: "--replay-samples-per-class 5"}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Restore or download SplitMNIST dataset
        uses: actions/cache@v4
        with:
          path: data
          key: splitmnist-dataset-v1-${{ runner.os }}

      - name: Run 5 experiences (${{ matrix.label }})
        run: |
          python -m skill_memory.demos.demo_splitmnist \
            --dataset-root data \
            --n-experiences 5 \
            --memory-per-class 20 \
            --train-samples-per-class 20 \
            --class-train-epochs 1 \
            --update-mode ${{ matrix.mode }} \
            ${{ matrix.replay }} \
            --diagnose \
            | tee splitmnist_${{ matrix.label }}.txt
          # The replay audit must report no violations.
          grep -q "violations: none" splitmnist_${{ matrix.label }}.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-${{ matrix.label }}-${{ github.run_id }}
          path: splitmnist_*.txt
          if-no-files-found: warn
          retention-days: 14

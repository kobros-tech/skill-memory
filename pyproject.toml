[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-memory"
version = "2.3.0"
description = "Class-level, probe-based Skill Memory plugin for Avalanche continual learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kobros-Tech Ltd" }]
keywords = [
    "continual-learning",
    "catastrophic-forgetting",
    "avalanche",
    "pytorch",
    "class-incremental-learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "avalanche-lib>=0.6.0",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/kobros-tech/skill-memory"
Repository = "https://github.com/kobros-tech/skill-memory"
Issues = "https://github.com/kobros-tech/skill-memory/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "pre-commit>=3.0"]

[tool.setuptools]
packages = [
    "skill_memory",
    "skill_memory.cl",
    "skill_memory.evaluation",
    "skill_memory.utils",
    "skill_memory.diagnostics",
    "skill_memory.demos",
]

[tool.setuptools.package-data]
skill_memory = ["README.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = [
    "skill_memory",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
